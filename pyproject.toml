[project]
name = "RAG-Tutorial"
version = "0.1.0"
description = "Retrieval-Augmented Generation (RAG) Tutorial - Learn to build RAG systems from scratch"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "RAG Tutorial Authors", email = "example@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-core>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "langchain-openai>=0.0.2",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "faiss-cpu>=1.7.4",
    "chromadb>=0.4.0",
    "pdfplumber>=0.10.3",
    "unstructured>=0.10.0",
    "nltk>=3.8.1",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "langchain-ollama>=0.0.0; python_version > '3.9'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
llm = [
    "langchain-openai>=0.0.2",
    "langchain-ollama>=0.0.0; python_version > '3.9'",
    "langsmith>=0.0.49",
]
vector-db = [
    "chromadb>=0.4.0",
    "weaviate-client>=3.20.0",
    "pinecone-client>=2.2.0",
]
pdf = [
    "pdfplumber>=0.10.3",
    "unstructured>=0.10.0",
    "pypdf>=3.0.0",
]
evaluation = [
    "ragas>=0.1.0",
    "trulens-core>=0.3.0",
    "scikit-learn>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/example/rag-tutorial"
Documentation = "https://github.com/example/rag-tutorial#readme"
Repository = "https://github.com/example/rag-tutorial.git"
Issues = "https://github.com/example/rag-tutorial/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["RAG_Tutorial"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
