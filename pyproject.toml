[project]
name = "RAG-Tutorial"
version = "0.1.0"
description = "Retrieval-Augmented Generation (RAG) Tutorial - Learn to build RAG systems from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RAG Tutorial Authors", email = "example@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "ollama>=0.4.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.5.0",
    "faiss-cpu>=1.8.0",
    "chromadb>=0.5.0",
    "pypdf>=3.0.0",
    "nltk>=3.9.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
llm = [
    "langchain-ollama>=0.2.0",
    "langsmith>=0.1.0",
]
vector-db = [
    "chromadb>=0.5.0",
    "weaviate-client>=4.0.0",
    "pinecone-client>=5.0.0",
]
pdf = [
    "pypdf>=3.0.0",
]
evaluation = [
    "ragas>=0.2.0",
    "trulens-core>=0.8.0",
    "scikit-learn>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/example/rag-tutorial"
Documentation = "https://github.com/example/rag-tutorial#readme"
Repository = "https://github.com/example/rag-tutorial.git"
Issues = "https://github.com/example/rag-tutorial/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"



[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
